<nav><button class="nav-item active" data-page="overview"><i class="ph ph-squares-four" aria-hidden="true"></i><span>Overview</span></button><button class="nav-item" data-page="finance"><i class="ph ph-wallet" aria-hidden="true"></i><span>Keuangan</span></button><button class="nav-item" data-page="planning"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>Planning</span></button><button class="nav-item" data-page="work"><i class="ph ph-kanban" aria-hidden="true"></i><span>Kerja</span><span class="nav-count" id="task-count">0</span></button></nav>
<div class="side-bottom"><div class="together-card"><i class="ph ph-sparkle" aria-hidden="true"></i><h3>Better, together.</h3><p>Rencana kecil hari ini.<br>Mimpi besar kita nanti.</p></div><div class="profile flex-row"><div class="avatar-stack"><span class="avatar">D</span><span class="avatar pink">P</span></div><div><strong style="font-size:11px;font-weight:500">Dion & Pasangan</strong><p class="muted" style="font-size:9px;margin-top:4px">Satu ruang, satu tujuan.</p></div></div></div>
</aside>
<div class="main"><header class="topbar"><div class="breadcrumb"><i class="ph ph-house-line" style="font-size:15px" aria-hidden="true"></i><span>Our little space</span><span style="color:#524d5c">/</span><span class="current" id="breadcrumb">Overview</span></div><a href="#overview" class="brand mobile-brand"><span class="brand-icon"><i class="ph ph-intersect" aria-hidden="true"></i></span>SyncSpace.</a><div class="top-tools"><span class="date-top" id="header-date">Hari ini</span><span class="demo-pill" style="background:#1d382d;color:#75d5b4;border-color:#2a5041">LIVE CLOUD</span><span class="divider"></span><div class="avatar-stack" aria-label="Dion dan Pasangan"><span class="avatar">D</span><span class="avatar pink">P</span></div></div></header><main id="content" class="page-wrap" tabindex="-1"></main></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="spread"><h2 id="modal-title"></h2><button class="icon-btn" id="close-modal" aria-label="Tutup dialog"><i class="ph ph-x" aria-hidden="true"></i></button></div><p class="form-description" id="modal-description"></p><form id="entry-form"></form></dialog><div id="toast" class="toast" role="status" hidden></div>

<!-- Menggunakan Script Module untuk fitur Firebase Cloud -->
<script type="module">
// 1. IMPORT FIREBASE DARI CDN
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 2. KONFIGURASI FIREBASE (Dari Akunmu)
const firebaseConfig = {
  apiKey: "AIzaSyCbQHNDelS6ZSFpokQnabSMxZM5kptSc7k",
  authDomain: "stzshx.firebaseapp.com",
  projectId: "stzshx",
  storageBucket: "stzshx.firebasestorage.app",
  messagingSenderId: "1008220927678",
  appId: "1:1008220927678:web:0fffca785febae056fd0ef",
  measurementId: "G-FDEWBGRQJ1"
};

// 3. INISIALISASI DATABASE
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 4. MENGATUR TANGGAL OTOMATIS (Mengikuti Waktu Indonesia)
const dateObj = new Date();
const TODAY = dateObj.toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' }); // Format: YYYY-MM-DD
document.getElementById('header-date').textContent = dateObj.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' });

// 5. STATE DATA (Dikosongkan karena akan diisi oleh Firestore)
let transactions = [];
let tasks = [];
let events = [];
let saved = 0;

let page = 'overview', taskFilter = 'Semua', ownerFilter = 'Semua', financeType = 'all', financeSearch = '', selectedDay = '', activeModal = '', triggerElement;

// 6. FUNGSI SINKRONISASI REAL-TIME (onSnapshot)
onSnapshot(collection(db, "transactions"), (snapshot) => {
    transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
});
onSnapshot(collection(db, "tasks"), (snapshot) => {
    tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
});
onSnapshot(collection(db, "events"), (snapshot) => {
    events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
});
onSnapshot(doc(db, "settings", "savings"), (docSnapshot) => {
    saved = docSnapshot.exists() ? (docSnapshot.data().amount || 0) : 0;
    render();
});

// 7. FUNGSI UTILITAS & KOMPONEN UI
const money=n=>'Rp '+new Intl.NumberFormat('id-ID').format(n);
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i class="ph ph-${n}" aria-hidden="true"></i>`;
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const avatar=o=>o==='Bersama'?`<span class="avatar-stack" aria-label="Dion dan Pasangan"><span class="avatar">D</span><span class="avatar pink">P</span></span>`:`<span class="avatar ${o==='Pasangan'?'pink':''}" aria-label="${o}">${o==='Pasangan'?'P':'D'}</span>`;
const tag=o=>`<span class="tag ${o==='Bersama'?'rose':o==='Pasangan'?'cyan':''}">${o==='Dion'?'Pribadi':o==='Bersama'?'Berdua':'Pasangan'}</span>`;
const totals=()=>{const income=transactions.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);const expense=transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);return{income,expense,balance:income-expense}};
const footer=()=>`<footer class="footer"><span>${icon('intersect')} SyncSpace · Ruang kecil, rencana besar.</span><span><b class="status-dot"></b> Terhubung ke Firebase Cloud · Real-time Sync</span></footer>`;
const monthBadge=()=>`<span class="btn" style="cursor:default">${icon('calendar-blank')} ${dateObj.toLocaleDateString('id-ID',{month:'long',year:'numeric', timeZone: 'Asia/Jakarta'})}</span>`;

function header(eyebrow,title,subtitle,action,label){return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="head-actions">${monthBadge()}<button class="btn btn-primary hover:-translate-y-0.5" data-modal="${action}">${icon('plus')}${label}</button></div></div>`}
function statCards(finance=false){const t=totals();const remaining=tasks.filter(t=>t.date===TODAY&&t.status!=='done').length;return `<section class="stats" aria-label="Ringkasan bulan ini"><article class="stat"><div class="stat-label">${icon('wallet')} Total saldo bersama</div><div class="amount">${money(t.balance)}</div><div class="stat-foot"><span class="chip">${icon('check')} Positif</span><span>Pemasukan dikurangi pengeluaran</span></div></article><article class="stat"><div class="stat-label">${icon(finance?'arrow-down-left':'arrow-up-right')} ${finance?'Pemasukan':'Pengeluaran'}</div><div class="amount">${money(finance?t.income:t.expense)}</div><div class="stat-foot"><span class="chip ${finance?'':'pink'}">${finance?transactions.filter(t=>t.type==='income').length+' pemasukan':(t.income===0?0:Math.round(t.expense/t.income*100))+'% pemasukan'}</span><span>${finance?'Semua sumber pendapatan':'Tetap dalam kendali'}</span></div></article><article class="stat"><div class="stat-label">${icon(finance?'arrow-up-right':'check-square')} ${finance?'Pengeluaran':'Task hari ini'}</div><div class="amount">${finance?money(t.expense):remaining+' <span class="suffix">task tersisa</span>'}</div><div class="stat-foot"><span class="chip purple">${icon(finance?'receipt':'check')}${finance?transactions.filter(t=>t.type==='expense').length+' transaksi':tasks.filter(t=>t.date===TODAY&&t.status==='done').length+' selesai'}</span><span>${finance?'Seluruh kategori pengeluaran':'One step at a time.'}</span></div></article></section>`}

function recentTransactions(){
    if(!transactions.length) return '<p class="empty" style="padding:15px">Belum ada transaksi.</p>';
    return [...transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(t=>`<div class="transaction"><div class="tx-icon">${icon(t.icon)}</div><div><p class="tx-name">${escapeHTML(t.name)}</p><p class="tx-detail">${escapeHTML(t.category)} <span style="padding:0 4px">·</span> ${t.owner}</p></div><div class="tx-amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'} ${money(t.amount)}<div class="tx-detail">${dateLabel(t.date)}</div></div></div>`).join('');
}

function agendaRows(list){
    if(!list.length)return '<p class="empty">Belum ada agenda. Waktunya punya ruang untuk diri sendiri.</p>';
    return [...list].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>{const d=new Date(e.date+'T12:00:00');return `<article class="agenda-row"><div class="agenda-date"><span class="day">${d.toLocaleDateString('id-ID',{weekday:'short'})}</span><strong>${d.getDate()}</strong></div><div class="agenda-event ${e.owner==='Bersama'?'rose':e.owner==='Pasangan'?'cyan':''}"><h3>${escapeHTML(e.name)}</h3><div class="spread"><span class="event-time">${icon('clock')} ${e.time} WIB ${page==='planning'?' · '+escapeHTML(e.detail):''}</span>${tag(e.owner)}</div></div></article>`}).join('')
}

function todayTasks(){
    const list=tasks.filter(t=>t.date===TODAY&&(taskFilter==='Semua'||t.owner===taskFilter));
    return list.length?list.map(t=>`<div class="task-row ${t.status==='done'?'done':''}"><input type="checkbox" id="task-${t.id}" data-check="${t.id}" ${t.status==='done'?'checked':''}><label for="task-${t.id}">${escapeHTML(t.name)}<span class="task-meta">${t.status==='progress'?'<b class="priority"></b>Sedang dikerjakan':t.status==='done'?'Selesai':t.priority}</span></label>${avatar(t.owner)}</div>`).join(''):'<p class="empty">Tidak ada task untuk hari ini.</p>'
}

function overview(){
    const t=totals();
    const progress=Math.min(100,Math.round(saved/10000000*100));
    return header('YOUR SHARED SPACE','Halo, Dion & Pasangan <i class="ph ph-sparkle" style="color:#b6a0ee;font-size:24px" aria-hidden="true"></i>','Semua rencana kita, dalam satu tempat. Let’s make today count.','transaction','Catat transaksi')+statCards()+`<div class="dashboard-grid"><section class="panel"><div class="panel-header spread"><div><h2>Arus keuangan</h2><p class="panel-subtitle">A little overview of our money.</p></div><button class="btn btn-ghost" data-page="finance">Lihat semua ${icon('arrow-up-right')}</button></div><div class="panel-body"><div class="cash-summary"><div class="cash-item"><span class="flow-icon">${icon('arrow-down-left')}</span><div><p>Pemasukan</p><strong>${money(t.income)}</strong></div></div><div class="cash-item"><span class="flow-icon out">${icon('arrow-up-right')}</span><div><p>Pengeluaran</p><strong>${money(t.expense)}</strong></div></div></div><p class="mini-label">TRANSAKSI TERBARU</p>${recentTransactions()}</div></section><section class="panel savings"><div class="panel-header spread"><h2>Target tabungan bersama</h2>${icon('sparkle')}</div><div class="panel-body"><div class="savings-hero"><span class="goal-icon">${icon('airplane-tilt')}</span><div><h3>Our next escape</h3><p class="panel-subtitle">Liburan ke Bali · Desember 2026</p></div></div><p class="goal-money">${money(saved)} <span>/ ${money(10000000)}</span></p><div class="progress-track" role="progressbar" aria-label="Tabungan liburan" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${progress}%"></div></div><div class="savings-meta"><span>${saved>=10000000?'Target tercapai!':money(10000000-saved)+' lagi menuju Bali'}</span><strong>${progress}%</strong></div><div class="saving-footer"><div class="flex-row" style="gap:0">${avatar('Bersama')}<p>Growing together</p></div><button class="btn save-btn" data-modal="saving">${icon('plus')} Tambah tabungan</button></div><p class="encouragement">${icon('sparkle')} ${progress>=100?'Bali, here we come. Kalian berhasil!':'Sedikit demi sedikit, makin dekat ke mimpi kita.'}</p></div></section><section class="panel"><div class="panel-header spread"><div><h2>Agenda terdekat</h2><p class="panel-subtitle">Jadwal yang akan datang</p></div><button class="btn btn-ghost" data-page="planning">Lihat planning ${icon('arrow-up-right')}</button></div><div class="panel-body">${agendaRows(events.filter(e=>e.date>=TODAY).slice(0,3))}</div></section><section class="panel"><div class="panel-header spread"><div><h2>Let’s get things done</h2><p class="panel-subtitle">Fokus kecil untuk hari ini.</p></div><button class="btn btn-ghost" data-page="work" aria-label="Lihat semua pekerjaan">${icon('arrow-up-right')}</button></div><div class="panel-body"><div class="tasks-toolbar" aria-label="Filter pemilik tugas">${['Semua','Dion','Pasangan','Bersama'].map(f=>`<button class="filter-tab ${taskFilter===f?'active':''}" data-taskfilter="${f}" aria-pressed="${taskFilter===f}">${f==='Dion'?'Saya':f}</button>`).join('')}</div><div id="today-tasks">${todayTasks()}</div></div></section></div>`+footer()}

function financeRows(){
    const list=[...transactions].sort((a,b)=>b.date.localeCompare(a.date)).filter(t=>(financeType==='all'||t.type===financeType)&&(t.name+' '+t.category+' '+t.owner).toLowerCase().includes(financeSearch.toLowerCase()));
    return list.length?list.map(t=>`<tr><td><div class="flex-row">${icon(t.icon)} ${escapeHTML(t.name)}</div></td><td><span class="tag">${escapeHTML(t.category)}</span></td><td>${t.owner}</td><td class="muted">${dateLabel(t.date)}</td><td class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'} ${money(t.amount)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Tidak ada transaksi yang cocok.</td></tr>'}

function finance(){return header('MONEY, IN SYNC','Keuangan bersama','Lebih transparan, lebih tenang. Setiap rupiah punya cerita.','transaction','Catat transaksi')+statCards(true)+`<section class="panel"><div class="panel-header"><h2>Riwayat transaksi</h2><p class="panel-subtitle">Pemasukan dan pengeluaran keseluruhan.</p></div><div class="panel-body" style="padding-bottom:0"><div class="toolbar"><label class="search">${icon('magnifying-glass')}<span class="sr-only">Cari transaksi</span><input class="field" id="finance-search" placeholder="Cari transaksi atau kategori…" value="${escapeHTML(financeSearch)}"></label><label><span class="sr-only">Jenis transaksi</span><select class="field" id="finance-type"><option value="all">Semua transaksi</option><option value="income" ${financeType==='income'?'selected':''}>Pemasukan</option><option value="expense" ${financeType==='expense'?'selected':''}>Pengeluaran</option></select></label></div></div><div class="table-wrap"><table><thead><tr><th>Transaksi</th><th>Kategori</th><th>Oleh</th><th>Tanggal</th><th>Nominal</th></tr></thead><tbody id="finance-rows">${financeRows()}</tbody></table></div><div class="table-footer">${transactions.length} transaksi tercatat · Mata uang IDR</div></section>`+footer()}

function planning(){
    const days=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
    // Membuat daftar 7 hari kalender berjalan mulai dari hari ini
    const weekDates = Array.from({length: 7}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() + i);
        return { label: days[d.getDay() === 0 ? 6 : d.getDay() - 1], full: d.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}), num: d.getDate() };
    });

    return header('MAKE TIME FOR US','Agenda & Planning','Antara kesibukan dan quality time, ada ruang untuk keduanya.','event','Tambah agenda')+`<div class="spread" style="margin-bottom:20px"><h2 style="font-size:15px">7 Hari Kedepan</h2><button class="btn btn-ghost" data-day="">Semua agenda ${icon('calendar-blank')}</button></div><div class="week-grid" aria-label="Pilih hari">${weekDates.map(d=>{return `<button class="day-cell ${selectedDay===d.full||(!selectedDay&&d.full===TODAY)?'selected':''}" data-day="${d.full}" aria-pressed="${selectedDay===d.full}"><span>${d.label}${d.full===TODAY?' · ini':''}</span><strong>${d.num}</strong>${events.some(e=>e.date===d.full)?'<b class="day-dot"></b>':'<b class="day-dot" style="opacity:0"></b>'}</button>`}).join('')}</div><div class="legend"><span><b></b> Jadwal pribadi</span><span><b class="cyan"></b> Jadwal pasangan</span><span><b class="rose"></b> Jadwal berdua</span></div><section class="panel"><div class="panel-header spread"><h2>${selectedDay?'Agenda '+dateLabel(selectedDay):'Seluruh Agenda'}</h2><span class="muted small">${events.filter(e=>!selectedDay||e.date===selectedDay).length} agenda</span></div><div class="panel-body planning-list">${agendaRows(events.filter(e=>!selectedDay||e.date===selectedDay))}</div></section>`+footer()}

function work(){return header('SMALL STEPS, BIG WINS','Kerja, lebih terarah','Bagi tugas, atur fokus, dan rayakan setiap progres kecil.','task','Tambah task')+`<div class="toolbar"><div class="flex-row"><span class="muted small">Ditugaskan ke</span><select class="field" id="owner-filter" aria-label="Filter penanggung jawab">${['Semua','Dion','Pasangan','Bersama'].map(o=>`<option value="${o}" ${ownerFilter===o?'selected':''}>${o==='Dion'?'Tugas saya':o==='Semua'?'Semua tugas':'Tugas '+o.toLowerCase()}</option>`).join('')}</select></div><p class="overview-mini-note">Pindahkan status lewat menu di setiap kartu.<br>Task hari ini juga muncul di Overview.</p></div><div class="kanban">${[['todo','To-do'],['progress','In progress'],['done','Done']].map(([status,label])=>{const list=tasks.filter(t=>t.status===status&&(ownerFilter==='Semua'||t.owner===ownerFilter));return `<section class="kanban-col"><h2 class="column-title"><span class="column-dot ${status}"></span>${label}<span class="count">${list.length}</span></h2>${list.length?list.map(t=>`<article class="task-card hover:border-violet-400/40"><div class="spread"><span class="tag ${t.priority==='Prioritas tinggi'?'rose':''}">${escapeHTML(t.priority)}</span>${icon(status==='done'?'check-circle':'dots-three')}</div><h3>${escapeHTML(t.name)}</h3><div class="spread"><span class="event-time">${icon('calendar-blank')} ${t.date===TODAY?'Hari ini':dateLabel(t.date)}</span>${avatar(t.owner)}</div><label><span class="sr-only">Status ${escapeHTML(t.name)}</span><select class="field" data-status="${t.id}"><option value="todo" ${status==='todo'?'selected':''}>To-do</option><option value="progress" ${status==='progress'?'selected':''}>In progress</option><option value="done" ${status==='done'?'selected':''}>Done</option></select></label></article>`).join(''):'<p class="empty" style="padding:25px 5px">Belum ada task.</p>'}</section>`}).join('')}</div>`+footer()}

function render(){
    document.getElementById('content').innerHTML=({overview,finance,planning,work})[page]();
    document.getElementById('breadcrumb').textContent=({overview:'Overview',finance:'Keuangan',planning:'Planning',work:'Kerja'})[page];
    document.querySelectorAll('.nav-item').forEach(b=>{
        const active=b.dataset.page===page;
        b.classList.toggle('active',active);
        if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')
    });
    document.getElementById('task-count').textContent=tasks.filter(t=>t.status!=='done').length;
    document.getElementById('content').classList.remove('page');
    void document.getElementById('content').offsetWidth;
    document.getElementById('content').classList.add('page');
}

function navigate(p){
    if(!['overview','finance','planning','work'].includes(p))return;
    page=p;
    render();
    if(location.hash!=='#'+p)history.replaceState(null,'','#'+p);
    window.scrollTo({top:0,behavior:'instant'})
}

function toast(text){
    const el=document.getElementById('toast');
    el.textContent=text;
    el.hidden=false;
    clearTimeout(window.toastTimer);
    window.toastTimer=setTimeout(()=>el.hidden=true,3200)
}

const inputField=(label,name,type,extra='')=>`<label class="form-field">${label}<input class="field" name="${name}" type="${type}" required ${extra}></label>`;
const ownerSelect=()=>`<label class="form-field">Penanggung jawab<select class="field" name="owner"><option>Dion</option><option>Pasangan</option><option>Bersama</option></select></label>`;

function openModal(type){
    activeModal=type;
    triggerElement=document.activeElement;
    const details={
        transaction:['Catat transaksi','Biar keuangan kita tetap jelas dan teratur.'],
        event:['Tambah agenda','Luangkan waktu untuk hal yang penting.'],
        task:['Tambah task','Satu langkah kecil menuju hari yang produktif.'],
        saving:['Tambah tabungan','Catatan progres target terpisah dari saldo transaksi.']
    };
    document.getElementById('modal-title').textContent=details[type][0];
    document.getElementById('modal-description').textContent=details[type][1];
    let fields='';
    if(type==='transaction')fields=`<label class="form-field">Jenis transaksi<select name="type" class="field"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></label>${inputField('Nama transaksi','name','text','maxlength="80" placeholder="Contoh: Belanja bulanan"')}${inputField('Nominal (Rp)','amount','number','min="1" max="1000000000" step="1" placeholder="150000"')}<div class="form-columns"><label class="form-field">Kategori<select class="field" name="category">${['Kebutuhan','Gaji','Freelance','Konten','Tagihan','Tempat tinggal','Hiburan','Lainnya'].map(c=>'<option>'+c+'</option>').join('')}</select></label>${ownerSelect()}</div>${inputField('Tanggal transaksi','date','date','value="'+TODAY+'"')}`;
    if(type==='event')fields=inputField('Nama agenda','name','text','maxlength="80" placeholder="Contoh: Date night"')+`<div class="form-columns">${inputField('Tanggal','date','date','value="'+TODAY+'"')}${inputField('Waktu (WIB)','time','time','value="19:00"')}</div>`+ownerSelect()+inputField('Lokasi / catatan','detail','text','maxlength="100" placeholder="Contoh: Di rumah"');
    if(type==='task')fields=inputField('Nama task','name','text','maxlength="100" placeholder="Apa yang ingin diselesaikan?"')+ownerSelect()+`<div class="form-columns"><label class="form-field">Label<select class="field" name="priority"><option>Personal</option><option>Prioritas tinggi</option><option>Konten</option><option>Rumah</option><option>Keuangan</option></select></label>${inputField('Tenggat','date','date','value="'+TODAY+'"')}</div>`;
    if(type==='saving')fields=`<div style="margin-bottom:20px"><p class="muted small">Tabungan saat ini</p><p class="goal-money" style="margin-top:8px">${money(saved)}</p></div>`+inputField('Jumlah yang ditambahkan (Rp)','amount','number','min="1" max="1000000000" step="1" placeholder="500000"')+`<p class="muted small">Ini memperbarui target tabungan, bukan mengurangi saldo bersama.</p>`;
    
    document.getElementById('entry-form').innerHTML=fields+`<div class="form-actions"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn btn-primary">${icon('check')} Simpan ${type==='transaction'?'transaksi':type==='event'?'agenda':type==='task'?'task':'tabungan'}</button></div>`;
    document.getElementById('modal').showModal();
}

function closeModal(){document.getElementById('modal').close()}
document.getElementById('close-modal').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('close',()=>{if(triggerElement&&triggerElement.isConnected)triggerElement.focus()});

// 8. EVENT LISTENER UNTUK KLIK DAN PERUBAHAN UI (Menyimpan ke Firebase)
document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-page]'); if(nav)navigate(nav.dataset.page);
    const modal=e.target.closest('[data-modal]'); if(modal)openModal(modal.dataset.modal);
    if(e.target.closest('[data-close]'))closeModal();
    const filter=e.target.closest('[data-taskfilter]'); if(filter){taskFilter=filter.dataset.taskfilter;render()}
    const day=e.target.closest('[data-day]'); if(day){selectedDay=day.dataset.day;render()}
});

document.addEventListener('change', async e=>{
    // Centang Task (Checkbox di Overview)
    if(e.target.matches('[data-check]')){
        const taskId = e.target.dataset.check;
        const newStatus = e.target.checked ? 'done' : 'todo';
        await updateDoc(doc(db, "tasks", taskId), { status: newStatus });
        toast(newStatus==='done'?'Nice! Satu task berhasil diselesaikan.':'Task kembali ke To-do.');
    }
    // Ubah Status Task (Dropdown di Kerja)
    if(e.target.matches('[data-status]')){
        const taskId = e.target.dataset.status;
        await updateDoc(doc(db, "tasks", taskId), { status: e.target.value });
        toast('Status task diperbarui.');
    }
    if(e.target.id==='owner-filter'){ownerFilter=e.target.value;render()}
    if(e.target.id==='finance-type'){financeType=e.target.value;document.getElementById('finance-rows').innerHTML=financeRows()}
});

document.addEventListener('input',e=>{
    if(e.target.id==='finance-search'){financeSearch=e.target.value;document.getElementById('finance-rows').innerHTML=financeRows()}
});

// 9. FORM SUBMIT (Menambah data baru ke Firebase)
document.getElementById('entry-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const form=e.target;
    const data=Object.fromEntries(new FormData(form));
    
    if(data.name&&!data.name.trim()){
        form.elements.name.setCustomValidity('Nama tidak boleh kosong.');
        form.elements.name.reportValidity();
        form.elements.name.addEventListener('input',()=>form.elements.name.setCustomValidity(''),{once:true});
        return;
    }
    const amount=Number(data.amount);
    
    // Tampilkan status loading ringan pada tombol (opsional)
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = 'Menyimpan...';
    submitBtn.disabled = true;

    try {
        if(activeModal==='transaction'){
            await addDoc(collection(db, "transactions"), {
                name: data.name.trim(),
                amount: amount,
                type: data.type,
                category: data.category,
                date: data.date,
                owner: data.owner,
                icon: data.type==='income'?'arrow-down-left':'receipt'
            });
        }
        if(activeModal==='event'){
            await addDoc(collection(db, "events"), {
                name: data.name.trim(),
                date: data.date,
                time: data.time,
                owner: data.owner,
                detail: data.detail.trim()
            });
            selectedDay='';
        }
        if(activeModal==='task'){
            await addDoc(collection(db, "tasks"), {
                name: data.name.trim(),
                owner: data.owner,
                priority: data.priority,
                date: data.date,
                status: 'todo'
            });
        }
        if(activeModal==='saving'){
            await setDoc(doc(db, "settings", "savings"), {
                amount: saved + amount
            });
        }
        
        closeModal();
        toast(activeModal==='saving'?'Tabungan bertambah. Mimpi kita makin dekat!':'Berhasil disinkronisasi ke ruang kita.');
        
    } catch (error) {
        console.error("Error adding document: ", error);
        toast('Gagal menyimpan. Pastikan internet lancar dan aturan Firebase sudah Test Mode.');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});

// Routing
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
navigate(['overview','finance','planning','work'].includes(location.hash.slice(1))?location.hash.slice(1):'overview');
</script>
